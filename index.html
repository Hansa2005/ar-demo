<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Smart Menu AR Experience - Stable Demo</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0px;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        /* Custom styled minimalist loading overlay */
        #custom-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #121212; z-index: 9999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            font-family: sans-serif; color: white;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="custom-loader">
        <div class="spinner"></div>
        <div>Loading Menu AR Experience...</div>
    </div>

    <script>
        AFRAME.registerComponent('fix-ai-materials', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    obj.traverse(node => {
                        if (node.isMesh && node.material) {
                            const originalMats = Array.isArray(node.material) ? node.material : [node.material];
                            const newMats = originalMats.map(mat => {
                                if (!mat) return mat;
                                const basicMat = new THREE.MeshBasicMaterial({
                                    map: mat.map,
                                    color: new THREE.Color(0xffffff),
                                    side: THREE.DoubleSide
                                });
                                if (basicMat.map) {
                                    basicMat.map.encoding = THREE.sRGBEncoding;
                                    basicMat.map.needsUpdate = true;
                                }
                                return basicMat;
                            });
                            node.material = Array.isArray(node.material) ? newMats : newMats[0];
                            node.material.needsUpdate = true;
                        }
                    });
                });
            }
        });
    </script>

    <a-scene 
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;" 
        embedded 
        vr-mode-ui="enabled: false" 
        renderer="colorManagement: true, precision: medium">
        
        <a-assets>
            <a-asset-item id="pizza-model" src="pizza.glb"></a-asset-item>
            <a-asset-item id="chef-model" src="chef.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            
            <a-entity position="0 0 0" scale="1 1 1" rotation="0 0 0">
                
                <a-entity 
                    gltf-model="#pizza-model" 
                    fix-ai-materials
                    position="0 0 0" 
                    rotation="0 0 0"
                    scale="1 1 1">
                </a-entity>

                <a-entity 
                    position="0 0 0" 
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
                    
                    <a-entity 
                        gltf-model="#chef-model"
                        fix-ai-materials
                        position="0 0.35 0.4"
                        scale="0.22 0.22 0.22"
                        rotation="0 90 0"
                        animation-mixer="loop: repeat; timeScale: 1.1;">
                    </a-entity>

                </a-entity>

            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        // Smoothly hide the custom loading screen block as soon as MindAR boots up the camera feed
        document.querySelector('a-scene').addEventListener("arReady", (event) => {
            document.getElementById('custom-loader').style.display = 'none';
        });
    </script>
</body>
</html>
