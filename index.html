<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Smart Menu AR Experience - Demo</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        /* Force transparent backgrounds so the camera feed is visible underneath */
        html, body, a-scene {
            background-color: transparent !important;
            margin: 0px;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        /* Modern full-screen overlay for loading states */
        .arjs-loader {
            height: 100%; width: 100%; position: absolute; top: 0; left: 0;
            background-color: rgba(18, 18, 18, 0.95); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .arjs-loader div {
            text-align: center; color: #ffffff; font-size: 1.4em; font-weight: 500; margin-bottom: 10px;
        }
        .arjs-loader .sub-text {
            color: #a0a0a0; font-size: 0.9em; font-weight: 400;
        }
    </style>
</head>
<body>
    
    <div class="arjs-loader" id="loading-screen">
        <div>Initializing 3D AR Engine...</div>
        <div class="sub-text" id="status-text">Requesting system camera permissions...</div>
    </div>

    <script>
        AFRAME.registerComponent('fix-ai-materials', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    
                    obj.traverse(node => {
                        if (node.isMesh && node.material) {
                            const originalMats = Array.isArray(node.material) ? node.material : [node.material];
                            const newMats = originalMats.map(mat => {
                                if (!mat) return mat;
                                
                                const basicMat = new THREE.MeshBasicMaterial({
                                    map: mat.map,
                                    color: new THREE.Color(0xffffff),
                                    side: THREE.DoubleSide
                                });
                                
                                if (basicMat.map) {
                                    basicMat.map.encoding = THREE.sRGBEncoding;
                                    basicMat.map.needsUpdate = true;
                                }
                                
                                return basicMat;
                            });
                            
                            node.material = Array.isArray(node.material) ? newMats : newMats[0];
                            node.material.needsUpdate = true;
                        }
                    });
                });
            }
        });
    </script>

    <a-scene
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium; colorManagement: true;"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="pizza-model" src="pizza.glb"></a-asset-item>
            <a-asset-item id="chef-model" src="chef.glb"></a-asset-item>
        </a-assets>

        <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
        <a-entity light="type: directional; intensity: 1.0; position: 1 4 3"></a-entity>

        <a-marker preset="hiro">
            
            <a-entity position="0 0 -0.5" scale="1.2 1.2 1.2" rotation="-60 0 0">
                
                <a-entity 
                    gltf-model="#pizza-model" 
                    fix-ai-materials
                    position="0 0 0" 
                    rotation="0 0 0">
                </a-entity>

                <a-entity 
                    gltf-model="#chef-model"
                    fix-ai-materials
                    position="-0.5 0.45 0.1"
                    scale="0.25 0.25 0.25"
                    rotation="0 90 0"
                    animation-mixer="loop: repeat; timeScale: 1.1;"
                    animation="property: position; from: -0.5 0.45 0.1; to: 0.5 0.45 0.1; dur: 6000; dir: alternate; loop: true; easing: linear">
                </a-entity>

            </a-entity>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const loader = document.getElementById('loading-screen');
        const statusText = document.getElementById('status-text');

        // Force clear the loading screen once the video stream injection succeeds
        window.addEventListener('camera-init', (data) => {
            setTimeout(() => { loader.style.display = 'none'; }, 500);
        });

        // Backup event check: if scene renders, clear loader if camera took too long
        document.querySelector('a-scene').addEventListener('renderstart', () => {
            statusText.innerText = "Scene rendering... loading camera feed.";
            setTimeout(() => { loader.style.display = 'none'; }, 1500);
        });

        // Fail-safe check for hardware browser environment access 
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .catch(function(err) {
                statusText.innerHTML = "<span style='color: #ff6b6b;'>Camera Access Denied! Please check your App Permissions.</span>";
            });
        }
    </script>
</body>
</html>
