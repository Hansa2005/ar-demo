<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Smart Menu AR Experience - Stable Build</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-aframe.prod.js"></script>
    
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        html, body {
            margin: 0px;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <script>
        AFRAME.registerComponent('fix-ai-materials', {
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (!obj) return;
                    obj.traverse(node => {
                        if (node.isMesh && node.material) {
                            const originalMats = Array.isArray(node.material) ? node.material : [node.material];
                            const newMats = originalMats.map(mat => {
                                if (!mat) return mat;
                                const basicMat = new THREE.MeshBasicMaterial({
                                    map: mat.map,
                                    color: new THREE.Color(0xffffff),
                                    side: THREE.DoubleSide
                                });
                                if (basicMat.map) {
                                    basicMat.map.encoding = THREE.sRGBEncoding;
                                    basicMat.map.needsUpdate = true;
                                }
                                return basicMat;
                            });
                            node.material = Array.isArray(node.material) ? newMats : newMats[0];
                            node.material.needsUpdate = true;
                        }
                    });
                });
            }
        });
    </script>

    <a-scene 
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/examples/image-tracking/assets/card-example/card.mind;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="pizza-model" src="pizza.glb"></a-asset-item>
            <a-asset-item id="chef-model" src="chef.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            
            <a-entity position="0 0 0" scale="1 1 1" rotation="60 0 0">
                
                <a-entity 
                    gltf-model="#pizza-model" 
                    fix-ai-materials
                    position="0 0 0" 
                    rotation="0 0 0"
                    scale="0.8 0.8 0.8">
                </a-entity>

                <a-entity 
                    position="0 0 0" 
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
                    
                    <a-entity 
                        gltf-model="#chef-model"
                        fix-ai-materials
                        position="0 0.35 0.4"
                        scale="0.22 0.22 0.22"
                        rotation="0 90 0"
                        animation-mixer="loop: repeat; timeScale: 1.1;">
                    </a-entity>

                </a-entity>

            </a-entity>

        </a-entity>
    </a-scene>

</body>
</html>
