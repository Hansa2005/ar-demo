<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Smart Menu AR Demo</title>
    
    <!-- Core A-Frame framework -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Optimized Marker-Based AR.js script -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Animation Plugin to play the internal loops from your Chef GLB -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- Scene Setup utilizing the Webcam component -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="pizza" src="pizza.glb"></a-asset-item>
            <a-asset-item id="chef" src="chef.glb"></a-asset-item>
        </a-assets>

        <!-- Ambient and Directional Lighting maps -->
        <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
        <a-entity light="type: directional; intensity: 1.0; position: 1 4 3"></a-entity>

        <!-- The Standard Universal Hiro Tracker -->
        <a-marker preset="hiro">
            
            <!-- Core Positioning Wrapper (Since it's a small marker on screen, keep scale near 1) -->
            <a-entity position="0 0 0" scale="1 1 1">
                
                <!-- 1. Your Custom Pizza Mesh -->
                <a-entity gltf-model="#pizza" position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-entity>

                <!-- 2. Your Animated Walking/Cutting Chef -->
                <a-entity 
                    gltf-model="#chef"
                    position="-0.5 0.1 0"
                    scale="0.25 0.25 0.25"
                    rotation="0 90 0"
                    animation-mixer="loop: repeat; timeScale: 1;"
                    animation="property: position; from: -0.5 0.1 0; to: 0.5 0.1 0; dur: 5000; dir: alternate; loop: true; easing: linear">
                </a-entity>

            </a-entity>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
